name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v2

      - name: SSH and Deploy
        env:
          SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
        run:
          echo "$SSH_PRIVATE_KEY" > keyfile
          chmod 600 keyfile
          ssh -t -i keyfile ubuntu@ec2-13-126-188-22.ap-south-1.compute.amazonaws.com "sudo bash ~/deploy.ssh"
